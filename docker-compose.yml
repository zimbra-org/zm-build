version: "3.8"

services:
  zimbra:
    image: william1988/cxs-zimbra:1.0.0
    container_name: cxs-zimbra
    hostname: mail.cloudxspace.com
    environment:
      - DOMAIN=cloudxspace.com
      - ZIMBRA_HOSTNAME=mail.cloudxspace.com
      - ADMIN_PASS=changeme
      - DNS_RESOLVER=8.8.8.8
    ports:
      - "25:25"       # SMTP
      - "80:80"       # HTTP
      - "443:443"     # HTTPS
      - "465:465"     # SMTPS
      - "587:587"     # Submission
      - "993:993"     # IMAPS
      - "995:995"     # POP3S
      - "7071:7071"   # Admin console
    volumes:
      # === Database / LDAP ===
      - ./data/ldap:/opt/zimbra/data/ldap               # OpenLDAP database
      - ./data/db:/opt/zimbra/db                         # MySQL/MariaDB data
      - ./data/logger-db:/opt/zimbra/logger/db           # Logger database

      # === Mail storage ===
      - ./data/store:/opt/zimbra/store                   # Mailbox message store
      - ./data/index:/opt/zimbra/index                   # Search indexes
      - ./data/redolog:/opt/zimbra/redolog               # Transaction redo logs
      - ./data/backup:/opt/zimbra/backup                 # Backups

      # === Configuration ===
      - ./data/conf:/opt/zimbra/conf                     # Zimbra config (localconfig.xml, certs, etc.)
      - ./data/ssl:/opt/zimbra/ssl                       # SSL certificates

      # === Logs ===
      - ./data/log:/opt/zimbra/log                       # Zimbra logs
      - ./data/mailboxd-logs:/opt/zimbra/mailboxd/logs   # Jetty/mailbox logs

      # === MTA data ===
      - ./data/amavisd:/opt/zimbra/data/amavisd          # Anti-virus/spam
      - ./data/clamav:/opt/zimbra/data/clamav             # ClamAV definitions
      - ./data/postfix:/opt/zimbra/data/postfix           # Postfix mail queue
      - ./data/opendkim:/opt/zimbra/data/opendkim         # DKIM signing keys
    cap_add:
      - SYS_PTRACE
      - NET_ADMIN
    restart: unless-stopped
