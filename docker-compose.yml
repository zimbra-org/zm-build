services:
  zimbra:
    image: william1988/cxs-zimbra:1.0.0
    container_name: cxs-zimbra
    hostname: mail.cloudxspace.com
    environment:
      - DOMAIN=cloudxspace.com
      - ZIMBRA_HOSTNAME=mail.cloudxspace.com
      - ADMIN_HOSTNAME=admin.cloudxspace.com
      - ADMIN_PASS=changeme
      - DNS_RESOLVER=8.8.8.8
    ports:
      - "25:25"       # SMTP
      - "80:80"       # HTTP
        # - "443:443"     # HTTPS
      - "10443:443"     # HTTPS
      - "465:465"     # SMTPS
      - "587:587"     # Submission
      - "993:993"     # IMAPS
      - "995:995"     # POP3S
      - "7071:7071"   # Admin console
    volumes:
      # Single bind mount for all Zimbra data — keeps everything on the host
      # under ./data/zimbra/ for easy backup and migration
      - ./data/zimbra:/opt/zimbra
    cap_add:
      - SYS_PTRACE
      - NET_ADMIN
    restart: unless-stopped
